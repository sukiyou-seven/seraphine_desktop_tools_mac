name: Build Seraphim

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swiftui-macos:
    name: SwiftUI macOS arm64
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server-status/go.mod
          cache-dependency-path: server-status/go.mod
      - name: Test SwiftUI core
        run: ./tests/run.sh
      - name: Build native application
        run: ./build.sh
      - name: Package application
        run: |
          ditto -c -k --sequesterRsrc --keepParent build/Seraphim.app build/Seraphim-SwiftUI-mac-arm64.zip
          cd build
          shasum -a 256 Seraphim-SwiftUI-mac-arm64.zip > Seraphim-SwiftUI-SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Seraphim-SwiftUI-mac-arm64
          path: build/Seraphim-SwiftUI-mac-arm64.zip
          if-no-files-found: error
          retention-days: 30

  electron:
    name: Electron macOS, Windows, Linux
    runs-on: macos-15
    defaults:
      run:
        working-directory: electron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server-status/go.mod
          cache-dependency-path: server-status/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - name: Test server
        working-directory: server-status
        run: go test ./...
      - name: Install dependencies
        run: npm ci
      - name: Test Electron core
        run: npm test
      - name: Package all platforms
        run: npm run pack:all
      - name: Verify archives and checksums
        run: |
          cd ../build/electron
          unzip -tqq Seraphim-Electron-*-mac-arm64.zip
          unzip -tqq Seraphim-Electron-*-win-x64.zip
          tar -tzf Seraphim-Electron-*-linux-x64.tar.gz >/dev/null
          shasum -a 256 Seraphim-Electron-*-mac-arm64.zip Seraphim-Electron-*-win-x64.zip Seraphim-Electron-*-linux-x64.tar.gz > SHA256SUMS.txt
          shasum -a 256 -c SHA256SUMS.txt
      - name: Upload Electron macOS package
        uses: actions/upload-artifact@v4
        with:
          name: Seraphim-Electron-mac-arm64
          path: build/electron/Seraphim-Electron-*-mac-arm64.zip
          if-no-files-found: error
          retention-days: 30
      - name: Upload Electron Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Seraphim-Electron-win-x64
          path: build/electron/Seraphim-Electron-*-win-x64.zip
          if-no-files-found: error
          retention-days: 30
      - name: Upload Electron Linux package
        uses: actions/upload-artifact@v4
        with:
          name: Seraphim-Electron-linux-x64
          path: build/electron/Seraphim-Electron-*-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: [swiftui-macos, electron]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download desktop packages
        uses: actions/download-artifact@v4
        with:
          pattern: Seraphim-*
          path: release
          merge-multiple: true
      - name: Verify package count and create checksums
        run: |
          set -euo pipefail
          test "$(find release -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' \) | wc -l)" -eq 4
          (cd release && sha256sum Seraphim-*.zip Seraphim-*.tar.gz > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
      - name: Publish packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            title="Seraphim $tag"
            release_kind=stable
          else
            tag="build-${GITHUB_RUN_NUMBER}"
            title="Seraphim build ${GITHUB_RUN_NUMBER}"
            release_kind=preview
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
          elif [[ "$release_kind" == preview ]]; then
            gh release create "$tag" release/* --target "$GITHUB_SHA" --title "$title" \
              --notes "Automated preview build from commit $GITHUB_SHA. Unsigned desktop packages." --prerelease
          else
            gh release create "$tag" release/* --title "$title" \
              --notes "Automated release from commit $GITHUB_SHA. Unsigned desktop packages."
          fi
